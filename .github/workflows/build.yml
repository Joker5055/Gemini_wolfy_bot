name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Verify Android directory and Manifest
        run: |
          # Agar android folder nahi hai to flutter create se banayein
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
          
          # Ensure internet permission and label in AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Updating AndroidManifest.xml..."
            # Simple check or replace can go here if needed
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: WolfiesHitBot-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
